
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamilan AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#090e1c;
 color:white;
 font-family:Arial;
 height:100vh;
 display:flex;
 flex-direction:column;
}

header{
 background:#151d32;
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:23px;
 font-weight:bold;
 color:#829cff;
}

#clear{
 background:#293653;
 border:0;
 color:white;
 padding:9px 12px;
 border-radius:10px;
}

#chat{
 flex:1;
 overflow-y:auto;
 padding:18px;
}

.welcome{
 text-align:center;
 margin-top:30px;
}

.welcome h2{font-size:27px}
.welcome p{color:#aab5d0}

.msg{
 padding:13px 16px;
 margin:12px 0;
 border-radius:15px;
 max-width:88%;
 line-height:1.5;
 overflow-wrap:anywhere;
}

.user{
 background:#526fff;
 margin-left:auto;
}

.ai{background:#19243c}

footer{
 display:flex;
 padding:12px;
 background:#151d32;
 gap:8px;
}

input{
 flex:1;
 min-width:0;
 padding:14px;
 border:0;
 border-radius:25px;
 background:#26324c;
 color:white;
 font-size:16px;
}

button{
 border:0;
 border-radius:25px;
 padding:12px 18px;
 background:#718cff;
 color:white;
 font-size:17px;
}

.note{
 text-align:center;
 color:#8793ae;
 font-size:11px;
 padding:5px;
}
</style>
<script src="https://js.puter.com/v2/"></script>
</head>

<body>

<header>
 <div class="logo">✦ TAMILAN AI</div>
 <button id="clear" onclick="clearChat()">
 Clear Chat
 </button>
</header>

<section id="imageStudio" style="
background:#151d32;    
padding:18px;
margin:15px;
border-radius:18px;
color:white;
">
<h2 style="color:#829cff">🎨 AI Image Studio</h2>

<p>Create your imagination!</p>

<textarea id="imagePrompt"
placeholder="Describe your image..."
style="
width:100%;
height:90px;
padding:12px;
border-radius:12px;
background:#26324c;
color:white;
border:0;
"></textarea>

<br><br>

<label style="
display:block;
background:#26324c;
padding:15px;
border-radius:12px;
">
🖼️ Upload an image
<input type="file" id="imageUpload" accept="image/*">
</label>

<img id="imagePreview" style="
display:none;
width:100%;
margin-top:15px;
border-radius:12px;
">

<p id="imageStatus">
Image generation coming soon!
</p>

</section>

<div id="chat">
 <div class="welcome">
  <h2>வணக்கம்! 👋</h2>
  <p>Welcome to Tamilan AI.<br>
  How can I help you?</p>
 </div>
</div>

<footer>
 <input id="input"
 placeholder="Message Tamilan AI..."
 autocomplete="off">

 <button onclick="send()">➤</button>
</footer>

<div class="note">
 TAMILAN AI • Version 1.1
</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

let messages=[];

try{
 messages=JSON.parse(
 localStorage.getItem("tamilanHistory")||"[]"
 );

 if(!Array.isArray(messages)) messages=[];
}catch(e){
 messages=[];
}

function save(){
 localStorage.setItem(
 "tamilanHistory",
 JSON.stringify(messages)
 );
}

function addMessage(text,type){

 const div=document.createElement("div");

 div.className="msg "+type;
 div.textContent=text;

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function render(){

 chat.innerHTML="";

 if(messages.length===0){

  chat.innerHTML=`
  <div class="welcome">
  <h2>வணக்கம்! 👋</h2>
  <p>Welcome to Tamilan AI.<br>
  How can I help you?</p>
  </div>`;
 }

 messages.forEach(m=>{
  addMessage(m.text,m.type);
 });
}


const API_URL = "https://YOUR-BACKEND-URL/api/chat";

async function send() {
    const text = input.value.trim();
    if (!text) return;

    messages.push({
        text: text,
        type: "user"
    });

    addMessage(text, "user");
    input.value = "";
    save();

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.textContent = "Tamilan AI is thinking...";
    chat.appendChild(loading);

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        if (!response.ok) {
            throw new Error("Connection failed");
        }

        const data = await response.json();

        if (typeof data.reply !== "string") {
            throw new Error("Invalid response");
        }

        loading.remove();

        messages.push({
            text: data.reply,
            type: "ai"
        });

        addMessage(data.reply, "ai");
        save();

    } catch (error) {
        loading.textContent =
            "AI connection not ready. Please try again.";
    }
}

function clearChat(){

 if(!confirm("Clear all chat history?"))return;

 messages=[];

 save();
 render();
}

input.addEventListener("keydown",function(e){

 if(e.key==="Enter"){
  send();
 }

});

render();

</script>

</body>
</html>
